kotlin.version=1.9.25
# Kotlin Gradle plugin, deliberately separate from the runtime `kotlin.version` above: Gradle 9 needs
# a newer plugin than that runtime, and bumping the plugin must not change the Kotlin stdlib that the
# published plugin depends on. 2.3.x is the lowest line whose compiler reads the Kotlin metadata (2.4)
# of Gradle 9.8's own API, which this plugin compiles against.
kotlin-plugin.version=2.3.10
